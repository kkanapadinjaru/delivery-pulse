version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ADO_ORG_URL=${ADO_ORG_URL}
      - ADO_PAT=${ADO_PAT}
      - ADO_PROJECT=${ADO_PROJECT}
      - SERVER_PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
