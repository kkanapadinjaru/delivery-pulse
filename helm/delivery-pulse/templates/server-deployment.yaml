apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "delivery-pulse.fullname" . }}-server
  labels:
    {{- include "delivery-pulse.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "delivery-pulse.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "delivery-pulse.server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "delivery-pulse.image" (dict "registry" .Values.imageRegistry "repository" .Values.server.image.repository "tag" .Values.server.image.tag "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "delivery-pulse.fullname" . }}
          env:
            - name: ADO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "delivery-pulse.fullname" . }}
                  key: ado-client-secret
          livenessProbe:
            {{- toYaml .Values.server.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.server.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
