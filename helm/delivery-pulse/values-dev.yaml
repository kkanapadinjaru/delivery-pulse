# values-dev.yaml — AKS cluster with Azure Application Gateway (manual config)
# Used by: deploy.sh install dev

ui:
  service:
    type: LoadBalancer
    annotations:
      # Reserved internal IP for the App Gateway backend pool
      # Update this value when a static IP is provisioned
      service.beta.kubernetes.io/azure-load-balancer-ipv4: ""
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
