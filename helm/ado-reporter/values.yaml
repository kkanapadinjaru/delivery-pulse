# Default values for ado-reporter

# -- Container registry for images
imageRegistry: ""

# Backend configuration
backend:
  replicaCount: 2
  image:
    repository: ado-reporter-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

# Frontend configuration
frontend:
  replicaCount: 2
  image:
    repository: ado-reporter-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 3
    periodSeconds: 10

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: ado-reporter.example.com
  tls:
    enabled: false
    secretName: ado-reporter-tls

# Azure DevOps configuration
config:
  adoOrgUrl: ""
  adoProject: ""

# Secrets (use --set or external secret management in production)
secrets:
  adoPat: ""

# Image pull secrets (for private registries)
imagePullSecrets: []

# Pod-level settings
nodeSelector: {}
tolerations: []
affinity: {}
